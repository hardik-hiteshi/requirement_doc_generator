name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Build machines should not phone home.
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ordered cheapest-first so an obvious failure reports in seconds rather
      # than after a full build.
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:8.0
        ports:
          # Deliberately not the default host port: a runner that already has a
          # MongoDB (self-hosted, or a local `act` run) would otherwise fail to
          # bind. The container port is unchanged.
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      MONGODB_HOST_PORT: '27018'
      MONGODB_URI: mongodb://127.0.0.1:27018/wdrg_ci
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build --filter='./packages/*'

      - name: Wait for MongoDB
        run: bash infrastructure/scripts/wait-for-mongo.sh

      - name: Run API integration tests
        run: pnpm --filter @wdrg/api test:e2e

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gating. The tree is currently clean at every severity, so a new high or
      # critical advisory is a real signal rather than pre-existing noise. If a
      # newly published advisory ever blocks unrelated work, the fix is an
      # explicit, reviewed exception — not a blanket `|| true`.
      - name: Audit dependencies
        run: pnpm audit --audit-level high
