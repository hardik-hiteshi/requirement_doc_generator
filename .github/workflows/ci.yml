name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Build machines should not phone home.
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The unit suite exercises the real OCR adapter rather than a stub. Without
      # the engine those tests would skip, which is a silent loss of coverage —
      # exactly what a CI gate is supposed to prevent.
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      # Ordered cheapest-first so an obvious failure reports in seconds rather
      # than after a full build.
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:8.0
        ports:
          # Deliberately not the default host port: a runner that already has a
          # MongoDB (self-hosted, or a local `act` run) would otherwise fail to
          # bind. The container port is unchanged.
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      MONGODB_HOST_PORT: '27018'
      MONGODB_URI: mongodb://127.0.0.1:27018/wdrg_ci
      LOG_LEVEL: warn
      # A scratch directory inside the workspace, removed with the runner.
      UPLOAD_STORAGE_ROOT: ${{ github.workspace }}/.ci-storage
      # Driven explicitly by the tests, so extraction is deterministic rather
      # than something that happens at some point after an upload.
      EXTRACTION_WORKER_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Build workspace packages
        run: pnpm build --filter='./packages/*'

      - name: Wait for MongoDB
        run: bash infrastructure/scripts/wait-for-mongo.sh

      - name: Run API integration tests
        run: pnpm --filter @wdrg/api test:e2e:main

      # A separate step because it is a separate Jest project in a process of its
      # own — pdfjs cannot be imported from a Jest environment another suite has
      # torn down. See apps/api/jest.pdf.config.ts. Run on its own so a failure
      # here is unambiguous, and so PDF verification is visibly present in CI.
      - name: Run isolated PDF extraction verification
        run: pnpm --filter @wdrg/api test:e2e:pdf

      # Proof rather than assertion: the same suites back to front. Nothing in
      # the main project may depend on where it lands in the order, and the PDF
      # project is unaffected either way because it is not in this pool.
      - name: Re-run API integration tests in reverse order
        run: pnpm --filter @wdrg/api test:e2e:main
        env:
          E2E_ORDER: reverse

  # Self-hosted infrastructure, verified against the real thing.
  #
  # No cloud account, no vendor credentials, no metered API. MinIO and ClamAV
  # are the same open-source images the compose stack runs, and the tests below
  # would not pass against a mock — a mocked object store cannot tell you a
  # bucket is private, and a mocked antivirus cannot tell you it detects
  # anything.
  infrastructure:
    name: Self-hosted storage and scanner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27020:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      clamav:
        # The tagged image ships a signature database, so a first start does not
        # download several hundred megabytes before it can answer.
        image: clamav/clamav:1.4
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 120s

    env:
      NODE_ENV: test
      MONGODB_HOST_PORT: '27020'
      MONGODB_URI: mongodb://127.0.0.1:27020/wdrg_ci_infra
      LOG_LEVEL: warn
      UPLOAD_STORAGE_ROOT: ${{ github.workspace }}/.ci-storage
      EXTRACTION_WORKER_ENABLED: 'false'
      # Local, throwaway credentials for a container that lives for one job.
      # Nothing here is a real secret, and nothing here costs anything.
      S3_ENDPOINT: 127.0.0.1
      S3_PORT: '9000'
      S3_USE_SSL: 'false'
      S3_BUCKET: wdrg-ci
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      MALWARE_SCANNER: clamav
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: '3310'
      MINIO_HOST_PORT: '9000'
      CLAMAV_HOST_PORT: '3310'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The upload path scans before it stores, and the requirement suite
      # exercises real extraction, so both engines have to be present.
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Build workspace packages
        run: pnpm build --filter='./packages/*'

      # MinIO runs as an explicit step rather than a service container: a
      # service container cannot supply a command, and this image needs
      # `server /data` — without it MinIO prints its usage and exits. The
      # compose stack has no such limitation, which is why it can declare it
      # normally.
      - name: Start self-hosted object storage
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=ci-access-key \
            -e MINIO_ROOT_PASSWORD=ci-secret-key \
            minio/minio:RELEASE.2025-04-22T22-12-26Z \
            server /data --console-address ":9001"

      - name: Wait for every service
        run: bash infrastructure/scripts/wait-for-services.sh

      # The same client image the compose stack uses, creating the same private
      # bucket. `anonymous set none` is explicit: a readable bucket would make
      # every other access control in the application pointless.
      - name: Create the private bucket
        run: |
          # --entrypoint: the mc image's entrypoint is `mc` itself, so a bare
          # `/bin/sh -c ...` would be read as arguments to mc.
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-04-16T18-13-26Z \
            -c '
              mc alias set ci http://127.0.0.1:9000 ci-access-key ci-secret-key &&
              mc mb --ignore-existing ci/wdrg-ci &&
              mc anonymous set none ci/wdrg-ci
            '

      - name: Verify the object store adapter
        run: pnpm --filter @wdrg/api exec node --experimental-vm-modules ./node_modules/jest/bin/jest.js --config jest.e2e.config.ts --runInBand test/s3-storage

      - name: Verify the malware scanner
        run: pnpm --filter @wdrg/api exec node --experimental-vm-modules ./node_modules/jest/bin/jest.js --config jest.e2e.config.ts --runInBand test/clamav-scanner

      # The end-to-end path: a clean upload is accepted and scanned, an infected
      # one is rejected before anything is stored, and one project cannot reach
      # another's objects.
      - name: Verify ingestion against real storage and scanning
        env:
          STORAGE_ADAPTER: s3
        run: pnpm --filter @wdrg/api exec node --experimental-vm-modules ./node_modules/jest/bin/jest.js --config jest.e2e.config.ts --runInBand test/requirement-sources

      # PDFs live in their own Jest project, so they need their own invocation
      # here too — otherwise moving them out of the main suite would have quietly
      # dropped PDF extraction from the real-storage regression.
      - name: Verify PDF extraction against real storage and scanning
        env:
          STORAGE_ADAPTER: s3
        run: pnpm --filter @wdrg/api exec node --experimental-vm-modules ./node_modules/jest/bin/jest.js --config jest.pdf.config.ts

      - name: Stop object storage
        if: always()
        run: docker rm -f minio || true

  browser:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    # The suite builds the workspace, starts the API and the web app and then drives the
    # whole application through a browser one worker at a time — see the note in
    # apps/e2e/playwright.config.ts for why one worker. A green run takes about 15
    # minutes here; the headroom is for a hung test, which costs its whole ten-minute
    # budget and then does it again on the retry. At 30 minutes that combination
    # cancelled the job, and a cancelled job uploads no diagnostics, so the failure that
    # caused it was invisible.
    timeout-minutes: 45

    services:
      mongodb:
        image: mongo:8.0
        ports:
          # A third host port, so this job can run alongside the integration job
          # on a self-hosted runner without either binding over the other.
          - 27019:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite's own databases are named in apps/e2e; this only says where
      # MongoDB is listening.
      MONGODB_HOST_PORT: '27019'
      MONGODB_URI: mongodb://127.0.0.1:27019/wdrg_ci
      LOG_LEVEL: debug

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The documented installation route. pnpm blocks dependency lifecycle
      # scripts by policy, so the browser download is an explicit step rather
      # than a postinstall side effect — which also keeps it out of every other
      # job's install.
      # Tesseract as well as a browser: the worker runs in the browser suite, so
      # an image upload genuinely goes through recognition.
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install Playwright browsers
        run: pnpm --filter @wdrg/e2e exec playwright install --with-deps chromium

      # The API is served from its production build, and the web application
      # from a Next.js production build. Playwright starts both, waits on their
      # readiness endpoints, and shuts them down when the run ends.
      - name: Build applications and packages
        run: pnpm build

      - name: Wait for MongoDB
        run: bash infrastructure/scripts/wait-for-mongo.sh

      - name: Run browser end-to-end tests
        run: pnpm --filter @wdrg/e2e test:e2e

      # Only on failure. A green run should leave nothing to download, and
      # traces and videos are large.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          path: |
            apps/e2e/.artifacts/report/
            apps/e2e/.artifacts/test-results/
            apps/e2e/.artifacts/*.log
          retention-days: 7
          if-no-files-found: warn

  # The deployable images, proved by running them.
  #
  # A Dockerfile that builds is not evidence of anything. This job builds both images,
  # starts them against real dependencies, drives the application through them over
  # HTTP, inspects what is inside them, scans them, and rehearses a backup restore
  # against a running container. Only then — and only on main — are they pushed.
  #
  # Everything it depends on is open source and self-hosted: MongoDB and ClamAV in
  # containers, Trivy for the scan, GHCR with the token GitHub already issues to the
  # job. No registry account to create, no scanner subscription, no per-image fee.
  images:
    name: Deployable images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      # Needed only by the publish step, which is skipped on pull requests. GITHUB_TOKEN
      # is issued and rotated by GitHub, so there is no registry credential in this
      # repository's secrets at all.
      packages: write

    env:
      # A user-defined network, rather than service containers: the smoke test and the
      # restore rehearsal both run containers of their own that need to reach MongoDB and
      # ClamAV *by name*, and a job-level service container is only reachable from the
      # runner host.
      NETWORK: wdrg-ci-images
      TRIVY_IMAGE: aquasec/trivy:0.74.0
      # The origin the web bundle is built with. Inlined at build time, so this decides
      # what the published web image is usable for — see docs/operations/deployment.md.
      # A repository variable overrides it for a deployment that publishes its own.
      WEB_API_ORIGIN: ${{ vars.WEB_API_BASE_URL || 'http://127.0.0.1:3001' }}

    steps:
      - uses: actions/checkout@v5

      - name: Resolve the release version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version}"

      - uses: docker/setup-buildx-action@v3

      # Built with --load so the *verified* image is the one that is later pushed. A
      # build-and-push in one step would publish an artefact nothing had run.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          tags: wdrg-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          tags: wdrg-web:ci
          load: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.WEB_API_ORIGIN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Contents before behaviour: if a secret or a source tree is in the image, that is
      # true whether or not the application starts, and it is the cheapest check here.
      - name: Inspect what is inside the images
        run: |
          bash infrastructure/scripts/verify-image.sh wdrg-api:ci --api
          bash infrastructure/scripts/verify-image.sh wdrg-web:ci --web

      - name: Start the dependencies
        run: |
          docker network create "${NETWORK}"

          docker run -d --name mongodb --network "${NETWORK}" mongo:8.0

          # The tagged image ships a signature database, so a first start does not
          # download several hundred megabytes before it can answer.
          docker run -d --name clamav --network "${NETWORK}" clamav/clamav:1.4

          echo 'Waiting for MongoDB...'
          for _ in $(seq 1 30); do
            docker run --rm --network "${NETWORK}" mongo:8.0 \
              mongosh mongodb://mongodb:27017 --quiet --eval 'db.adminCommand({ping:1}).ok' \
              >/dev/null 2>&1 && break
            sleep 5
          done

          # ClamAV loads roughly a gigabyte of signatures before it answers, which is
          # genuinely slow and is why the readiness probe reports it separately.
          echo 'Waiting for ClamAV...'
          for _ in $(seq 1 40); do
            docker exec clamav clamdcheck.sh >/dev/null 2>&1 && break
            sleep 10
          done

          docker exec clamav clamdcheck.sh

      - name: Start the application from the images
        run: |
          secret="$(openssl rand -hex 24)"
          admin_token="$(openssl rand -hex 24)"
          echo "::add-mask::${secret}"
          echo "::add-mask::${admin_token}"
          echo "ADMIN_TOKEN=${admin_token}" >> "$GITHUB_ENV"

          start_api() {
            docker run -d --name "$1" --network "${NETWORK}" \
              --publish "127.0.0.1:$2:3001" \
              --volume "$1-uploads:/var/lib/wdrg/uploads" \
              --env NODE_ENV=production \
              --env "MONGODB_URI=mongodb://mongodb:27017/$3" \
              --env LOG_LEVEL=warn \
              --env STORAGE_ADAPTER=filesystem \
              --env UPLOAD_STORAGE_ROOT=/var/lib/wdrg/uploads \
              --env MALWARE_SCANNER=clamav \
              --env CLAMAV_HOST=clamav \
              --env CLAMAV_PORT=3310 \
              --env AI_PROVIDER=disabled \
              --env RETENTION_ENABLED=false \
              --env "PROJECT_SESSION_SECRET=${secret}" \
              --env "API_PUBLIC_URL=http://127.0.0.1:$2" \
              --env "WEB_PUBLIC_URL=http://127.0.0.1:3000" \
              --env "ADMIN_API_TOKEN=$4" \
              wdrg-api:ci
          }

          # Two API instances, because the operator surface has two states worth
          # proving: absent when no token is configured, and behind a token boundary
          # when one is. A container cannot change its environment, so that is two
          # containers.
          start_api api 3001 wdrg_ci_images ''
          start_api api-admin 3002 wdrg_ci_images_admin "${admin_token}"

          docker run -d --name web --network "${NETWORK}" \
            --publish 127.0.0.1:3000:3000 \
            --env NODE_ENV=production --env PORT=3000 --env HOSTNAME=0.0.0.0 \
            wdrg-web:ci

          for target in 3001 3002; do
            echo "Waiting for the API on ${target}..."
            for _ in $(seq 1 40); do
              [[ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${target}/api/health/ready")" == '200' ]] && break
              sleep 3
            done
          done

          echo 'Waiting for the web application...'
          for _ in $(seq 1 30); do
            [[ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" == '200' ]] && break
            sleep 3
          done

      - name: Smoke test the deployment
        run: |
          bash infrastructure/scripts/smoke-test.sh \
            --api http://127.0.0.1:3001 \
            --web http://127.0.0.1:3000 \
            --production \
            --expect-version '${{ steps.version.outputs.version }}' \
            --expect-web-api-origin "${WEB_API_ORIGIN}"

      - name: Smoke test the operator surface behind its token
        run: |
          bash infrastructure/scripts/smoke-test.sh \
            --api http://127.0.0.1:3002 \
            --skip-web \
            --production \
            --admin-token "${ADMIN_TOKEN}"

      # The half of a backup procedure that is usually never tested. It destroys data
      # and gets it back, and it uses its own database and volume so it cannot touch
      # anything the steps above created.
      - name: Rehearse a backup restore
        run: |
          bash infrastructure/scripts/restore-rehearsal.sh \
            --network "${NETWORK}" \
            --database wdrg_ci_rehearsal \
            --api-image wdrg-api:ci \
            --port 3399

      # Gating on *fixable* findings only. An unfixed advisory in the Debian base has no
      # action attached to it — there is no patched version to move to — so gating on it
      # would make this permanently red and teach everyone to ignore it. The full report
      # including unfixed is printed either way, which is how the fact that this image
      # ships no package manager was found in the first place.
      - name: Scan the images
        run: |
          docker pull --quiet "${TRIVY_IMAGE}"

          for image in wdrg-api:ci wdrg-web:ci; do
            echo "::group::${image} — every HIGH and CRITICAL, including unfixed"
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "${HOME}/.cache/trivy:/root/.cache" \
              "${TRIVY_IMAGE}" image --scanners vuln --severity HIGH,CRITICAL \
              --quiet "${image}" || true
            echo '::endgroup::'

            echo "${image} — fixable HIGH and CRITICAL (gating)"
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "${HOME}/.cache/trivy:/root/.cache" \
              "${TRIVY_IMAGE}" image --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 --quiet "${image}"
          done

      - name: Collect container logs
        if: failure()
        run: |
          for container in api api-admin web mongodb clamav; do
            echo "::group::${container}"
            docker logs --tail 200 "${container}" 2>&1 || true
            echo '::endgroup::'
          done

      # Only from main, and only after every step above passed. `docker push` of the
      # image that was just verified, rather than a second build — the digest that goes
      # to the registry is the digest the smoke test ran against.
      - name: Publish to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io --username '${{ github.actor }}' --password-stdin

          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          sha="${GITHUB_SHA:0:12}"

          for pair in "api:wdrg-api:ci" "web:wdrg-web:ci"; do
            name="${pair%%:*}"
            local_tag="${pair#*:}"
            remote="ghcr.io/${owner}/wdrg-${name}"

            # Three tags, each answering a different question. `sha-` is the immutable
            # one and the only one worth deploying from: `main` moves, and a version
            # that has not been bumped points at whatever shipped last under it.
            for tag in "sha-${sha}" "${VERSION}" main; do
              docker tag "${local_tag}" "${remote}:${tag}"
              docker push --quiet "${remote}:${tag}"
              echo "pushed ${remote}:${tag}"
            done
          done

      - name: Stop everything
        if: always()
        run: |
          docker rm -f api api-admin web mongodb clamav >/dev/null 2>&1 || true
          docker volume rm -f api-uploads api-admin-uploads >/dev/null 2>&1 || true
          docker network rm "${NETWORK}" >/dev/null 2>&1 || true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gating. The tree is currently clean at every severity, so a new high or
      # critical advisory is a real signal rather than pre-existing noise. If a
      # newly published advisory ever blocks unrelated work, the fix is an
      # explicit, reviewed exception — not a blanket `|| true`.
      - name: Audit dependencies
        run: pnpm audit --audit-level high
