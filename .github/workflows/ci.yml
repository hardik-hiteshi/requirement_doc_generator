name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Build machines should not phone home.
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The unit suite exercises the real OCR adapter rather than a stub. Without
      # the engine those tests would skip, which is a silent loss of coverage —
      # exactly what a CI gate is supposed to prevent.
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      # Ordered cheapest-first so an obvious failure reports in seconds rather
      # than after a full build.
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:8.0
        ports:
          # Deliberately not the default host port: a runner that already has a
          # MongoDB (self-hosted, or a local `act` run) would otherwise fail to
          # bind. The container port is unchanged.
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      MONGODB_HOST_PORT: '27018'
      MONGODB_URI: mongodb://127.0.0.1:27018/wdrg_ci
      LOG_LEVEL: warn
      # A scratch directory inside the workspace, removed with the runner.
      UPLOAD_STORAGE_ROOT: ${{ github.workspace }}/.ci-storage
      # Driven explicitly by the tests, so extraction is deterministic rather
      # than something that happens at some point after an upload.
      EXTRACTION_WORKER_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Build workspace packages
        run: pnpm build --filter='./packages/*'

      - name: Wait for MongoDB
        run: bash infrastructure/scripts/wait-for-mongo.sh

      - name: Run API integration tests
        run: pnpm --filter @wdrg/api test:e2e:main

      # A separate step because it is a separate Jest project in a process of its
      # own — pdfjs cannot be imported from a Jest environment another suite has
      # torn down. See apps/api/jest.pdf.config.ts. Run on its own so a failure
      # here is unambiguous, and so PDF verification is visibly present in CI.
      - name: Run isolated PDF extraction verification
        run: pnpm --filter @wdrg/api test:e2e:pdf

      # Proof rather than assertion: the same suites back to front. Nothing in
      # the main project may depend on where it lands in the order, and the PDF
      # project is unaffected either way because it is not in this pool.
      - name: Re-run API integration tests in reverse order
        run: pnpm --filter @wdrg/api test:e2e:main
        env:
          E2E_ORDER: reverse

  # Self-hosted infrastructure, verified against the real thing.
  #
  # No cloud account, no vendor credentials, no metered API. MinIO and ClamAV
  # are the same open-source images the compose stack runs, and the tests below
  # would not pass against a mock — a mocked object store cannot tell you a
  # bucket is private, and a mocked antivirus cannot tell you it detects
  # anything.
  infrastructure:
    name: Self-hosted storage and scanner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27020:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      clamav:
        # The tagged image ships a signature database, so a first start does not
        # download several hundred megabytes before it can answer.
        image: clamav/clamav:1.4
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 120s

    env:
      NODE_ENV: test
      MONGODB_HOST_PORT: '27020'
      MONGODB_URI: mongodb://127.0.0.1:27020/wdrg_ci_infra
      LOG_LEVEL: warn
      UPLOAD_STORAGE_ROOT: ${{ github.workspace }}/.ci-storage
      EXTRACTION_WORKER_ENABLED: 'false'
      # Local, throwaway credentials for a container that lives for one job.
      # Nothing here is a real secret, and nothing here costs anything.
      S3_ENDPOINT: 127.0.0.1
      S3_PORT: '9000'
      S3_USE_SSL: 'false'
      S3_BUCKET: wdrg-ci
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      MALWARE_SCANNER: clamav
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: '3310'
      MINIO_HOST_PORT: '9000'
      CLAMAV_HOST_PORT: '3310'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The upload path scans before it stores, and the requirement suite
      # exercises real extraction, so both engines have to be present.
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Build workspace packages
        run: pnpm build --filter='./packages/*'

      # MinIO runs as an explicit step rather than a service container: a
      # service container cannot supply a command, and this image needs
      # `server /data` — without it MinIO prints its usage and exits. The
      # compose stack has no such limitation, which is why it can declare it
      # normally.
      - name: Start self-hosted object storage
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=ci-access-key \
            -e MINIO_ROOT_PASSWORD=ci-secret-key \
            minio/minio:RELEASE.2025-04-22T22-12-26Z \
            server /data --console-address ":9001"

      - name: Wait for every service
        run: bash infrastructure/scripts/wait-for-services.sh

      # The same client image the compose stack uses, creating the same private
      # bucket. `anonymous set none` is explicit: a readable bucket would make
      # every other access control in the application pointless.
      - name: Create the private bucket
        run: |
          # --entrypoint: the mc image's entrypoint is `mc` itself, so a bare
          # `/bin/sh -c ...` would be read as arguments to mc.
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-04-16T18-13-26Z \
            -c '
              mc alias set ci http://127.0.0.1:9000 ci-access-key ci-secret-key &&
              mc mb --ignore-existing ci/wdrg-ci &&
              mc anonymous set none ci/wdrg-ci
            '

      - name: Verify the object store adapter
        run: pnpm --filter @wdrg/api exec node --experimental-vm-modules ./node_modules/jest/bin/jest.js --config jest.e2e.config.ts --runInBand test/s3-storage

      - name: Verify the malware scanner
        run: pnpm --filter @wdrg/api exec node --experimental-vm-modules ./node_modules/jest/bin/jest.js --config jest.e2e.config.ts --runInBand test/clamav-scanner

      # The end-to-end path: a clean upload is accepted and scanned, an infected
      # one is rejected before anything is stored, and one project cannot reach
      # another's objects.
      - name: Verify ingestion against real storage and scanning
        env:
          STORAGE_ADAPTER: s3
        run: pnpm --filter @wdrg/api exec node --experimental-vm-modules ./node_modules/jest/bin/jest.js --config jest.e2e.config.ts --runInBand test/requirement-sources

      # PDFs live in their own Jest project, so they need their own invocation
      # here too — otherwise moving them out of the main suite would have quietly
      # dropped PDF extraction from the real-storage regression.
      - name: Verify PDF extraction against real storage and scanning
        env:
          STORAGE_ADAPTER: s3
        run: pnpm --filter @wdrg/api exec node --experimental-vm-modules ./node_modules/jest/bin/jest.js --config jest.pdf.config.ts

      - name: Stop object storage
        if: always()
        run: docker rm -f minio || true

  browser:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    # The suite builds the workspace, starts the API and the web app and then drives the
    # whole application through a browser one worker at a time — see the note in
    # apps/e2e/playwright.config.ts for why one worker. A green run takes about 15
    # minutes here; the headroom is for a hung test, which costs its whole ten-minute
    # budget and then does it again on the retry. At 30 minutes that combination
    # cancelled the job, and a cancelled job uploads no diagnostics, so the failure that
    # caused it was invisible.
    timeout-minutes: 45

    services:
      mongodb:
        image: mongo:8.0
        ports:
          # A third host port, so this job can run alongside the integration job
          # on a self-hosted runner without either binding over the other.
          - 27019:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite's own databases are named in apps/e2e; this only says where
      # MongoDB is listening.
      MONGODB_HOST_PORT: '27019'
      MONGODB_URI: mongodb://127.0.0.1:27019/wdrg_ci
      LOG_LEVEL: debug

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The documented installation route. pnpm blocks dependency lifecycle
      # scripts by policy, so the browser download is an explicit step rather
      # than a postinstall side effect — which also keeps it out of every other
      # job's install.
      # Tesseract as well as a browser: the worker runs in the browser suite, so
      # an image upload genuinely goes through recognition.
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install Playwright browsers
        run: pnpm --filter @wdrg/e2e exec playwright install --with-deps chromium

      # The API is served from its production build, and the web application
      # from a Next.js production build. Playwright starts both, waits on their
      # readiness endpoints, and shuts them down when the run ends.
      - name: Build applications and packages
        run: pnpm build

      - name: Wait for MongoDB
        run: bash infrastructure/scripts/wait-for-mongo.sh

      - name: Run browser end-to-end tests
        run: pnpm --filter @wdrg/e2e test:e2e

      # Only on failure. A green run should leave nothing to download, and
      # traces and videos are large.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          path: |
            apps/e2e/.artifacts/report/
            apps/e2e/.artifacts/test-results/
            apps/e2e/.artifacts/*.log
          retention-days: 7
          if-no-files-found: warn

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gating. The tree is currently clean at every severity, so a new high or
      # critical advisory is a real signal rather than pre-existing noise. If a
      # newly published advisory ever blocks unrelated work, the fix is an
      # explicit, reviewed exception — not a blanket `|| true`.
      - name: Audit dependencies
        run: pnpm audit --audit-level high
