name: ${COMPOSE_PROJECT_NAME:-wdrg-dev}

# Infrastructure for development, and the application itself behind a profile.
#
# By default this file starts dependencies only — MongoDB, MinIO, ClamAV — because
# running the apps with `pnpm dev` keeps the edit-reload loop fast, and that is what a
# developer wants. `--profile app` additionally builds and runs the API and the web
# application from the deployable images, which is what a deployment wants and what CI
# uses to prove those images work.
#
# Nothing about the default behaviour changed when the app profile was added: a service
# in a profile does not start unless the profile is named.
#
# Every service here is open-source and self-hosted. Nothing in this stack — or
# in the application it supports — requires a paid API, a managed service or a
# cloud account. See docs/operations/self-hosting.md.
#
# Host ports are configurable so the stack starts on a machine that already runs
# any of these. Container ports never change, so nothing inside the compose
# network has to be reconfigured. Host ports are validated by
# infrastructure/scripts/compose.sh before docker compose is invoked.
#
# Everything binds to 127.0.0.1. A development database, object store or virus
# scanner reachable from the network is a liability, not a convenience.

services:
  mongodb:
    image: mongo:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-wdrg-dev}-mongodb
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MONGODB_HOST_PORT:-27017}:27017'
    environment:
      MONGO_INITDB_DATABASE: wdrg
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Self-hosted S3-compatible object storage. No AWS account, no cloud
  # credentials: the access key below is a local development credential, and a
  # real deployment supplies its own.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ${COMPOSE_PROJECT_NAME:-wdrg-dev}-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '127.0.0.1:${MINIO_HOST_PORT:-9000}:9000'
      # The browser console, for looking at what the application stored.
      - '127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-wdrg-dev-access-key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-wdrg-dev-secret-key}
      # Anonymous access is off by default; stated explicitly so a future edit
      # has to make the change deliberately.
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Creates the bucket and locks it down. Runs once and exits — `docker compose
  # ps` showing it stopped is the success case, not a failure.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: ${COMPOSE_PROJECT_NAME:-wdrg-dev}-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-wdrg-dev-access-key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-wdrg-dev-secret-key}
      BUCKET: ${S3_BUCKET:-wdrg-requirements}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$BUCKET"
        # Private, explicitly. A bucket that is readable without credentials
        # would make every other access control in the application pointless.
        mc anonymous set none "local/$$BUCKET"
        echo "Bucket $$BUCKET is ready and private."
    restart: 'no'

  # Self-hosted malware scanning. The image ships with a signature database, so
  # a first start does not need to download several hundred megabytes before it
  # can answer — which matters most in CI.
  clamav:
    image: clamav/clamav:1.4
    container_name: ${COMPOSE_PROJECT_NAME:-wdrg-dev}-clamav
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CLAMAV_HOST_PORT:-3310}:3310'
    environment:
      # Signature updates run in the background. Turning them off would leave a
      # scanner that is running and progressively useless.
      CLAMAV_NO_FRESHCLAMD: 'false'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      # PING is the daemon's own liveness command, and it only answers once the
      # signature database is loaded — which is the thing that takes time.
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 1']
      interval: 15s
      timeout: 10s
      retries: 20
      # Loading ~1 GB of signatures into memory is genuinely slow on a cold
      # start. A short start_period here would report a healthy daemon as broken.
      start_period: 120s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: ${COMPOSE_PROJECT_NAME:-wdrg-dev}-mongo-express
    restart: unless-stopped
    # Optional database browser: `pnpm docker:tools`
    profiles: ['tools']
    ports:
      - '127.0.0.1:${MONGO_EXPRESS_HOST_PORT:-8081}:8081'
    environment:
      # Container-to-container, so always the container port.
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      mongodb:
        condition: service_healthy

  # --------------------------------------------------------------- the application
  #
  # Profile-gated, so `docker compose up` still starts dependencies only.
  #
  #   docker compose --profile app up --build
  #
  # These are the images that ship. Running them here is the only honest test that the
  # Dockerfiles work: a build that succeeds and a container that cannot reach its
  # database are different failures, and only the second one matters in production.
  api:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    image: ${API_IMAGE:-wdrg-api:local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://127.0.0.1:3001}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://127.0.0.1:3000}
      # Container-to-container, so the container port rather than the host one.
      MONGODB_URI: mongodb://mongodb:27017/${MONGODB_DATABASE:-wdrg}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Production refuses a filesystem root that moves with the working directory.
      UPLOAD_STORAGE_ROOT: /var/lib/wdrg/uploads
      # Filesystem storage on a named volume, and not `s3`, for a specific reason: the
      # production policy refuses an S3 endpoint that is not on this host and not
      # behind TLS, and MinIO here is plain HTTP on the compose network. That refusal
      # is correct — object storage credentials and client documents crossing a network
      # in the clear is exactly what it is for — so this stack uses the other supported
      # production configuration rather than weakening the check to make a demo start.
      #
      # A deployment that wants object storage sets STORAGE_ADAPTER=s3 with
      # S3_USE_SSL=true against a MinIO that terminates TLS. See
      # docs/operations/deployment.md.
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-filesystem}
      S3_ENDPOINT: minio
      S3_PORT: '9000'
      S3_USE_SSL: 'false'
      S3_BUCKET: ${MINIO_BUCKET:-wdrg-requirements}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-wdrg-dev-access-key}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-wdrg-dev-secret-key}
      MALWARE_SCANNER: ${MALWARE_SCANNER:-clamav}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      # No default. Production refuses the development placeholder, and a compose file
      # that supplied a working secret would be a compose file people deploy as-is.
      PROJECT_SESSION_SECRET: ${PROJECT_SESSION_SECRET:?set a random value of at least 32 characters}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-false}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3001}:3001'
    volumes:
      - uploads-data:/var/lib/wdrg/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  web:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        # Inlined into the client bundle at build time — see web.Dockerfile. Changing
        # this needs a rebuild, not a restart.
        NEXT_PUBLIC_API_BASE_URL: ${API_PUBLIC_URL:-http://127.0.0.1:3001}
    image: ${WEB_IMAGE:-wdrg-web:local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  # Namespaced by project so a throwaway verification stack cannot collide with
  # — or destroy — a developer's working data. `docker compose down` removes
  # containers and leaves these; `down -v` is the deliberate act that does not.
  mongodb-data:
    name: ${COMPOSE_PROJECT_NAME:-wdrg-dev}-mongodb-data
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:-wdrg-dev}-minio-data
  clamav-data:
    name: ${COMPOSE_PROJECT_NAME:-wdrg-dev}-clamav-data
  # Uploaded files, for the app profile's default filesystem adapter. A container
  # replacement must not take a client's documents with it, so the storage root is a
  # named volume rather than the container filesystem.
  uploads-data:
    name: ${COMPOSE_PROJECT_NAME:-wdrg-dev}-uploads-data
